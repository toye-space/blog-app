<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <nav>
      <div class="logo">MyBlog</div>
      <button class="btn" onclick="showForm()">+ New Post</button>
    </nav>

    <!-- Create/Edit Form -->
    <div class="form-overlay" id="form-overlay">
      <div class="form-box">
        <h2 id="form-title">New Post</h2>

        <input type="hidden" id="post-id" />

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Post title..." />
        </div>

        <div class="form-group">
          <label>Author</label>
          <input type="text" id="author" placeholder="Your name..." />
        </div>

        <div class="form-group">
          <label>Content</label>
          <textarea id="content" rows="6" placeholder="Write your post..."></textarea>
        </div>

        <div class="form-actions">
          <button class="btn" onclick="savePost()">Save Post</button>
          <button class="btn-cancel" onclick="hideForm()">Cancel</button>
        </div>

        <p id="form-feedback" class="feedback"></p>
      </div>
    </div>

    <!-- Posts Section -->
    <section class="posts-section">
      <h1>Latest <span class="highlight">Posts</span></h1>
      <p class="subtitle">Thoughts, ideas and things I've learned.</p>
      <div class="posts-grid" id="posts-grid"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
